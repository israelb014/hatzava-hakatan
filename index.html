<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2415" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="הצבא הקטן - משחק קרבות צבא חמוד בעברית" />
    <title>הצבא הקטן</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <div class="boot-title">הצבא הקטן</div>
      <svg class="boot-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#5c3a1c" stroke-width="12" />
        <circle id="boot-arc" cx="60" cy="60" r="50" fill="none" stroke="#ffc93a" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)" />
      </svg>
      <div class="boot-sub">טוען את המחנה...</div>
    </div>
    <div id="rotate">
      <svg viewBox="0 0 120 120" width="140" height="140" aria-hidden="true">
        <rect x="38" y="14" width="44" height="80" rx="9" fill="#f6e7bf" stroke="#3a2415" stroke-width="5" />
        <circle cx="60" cy="84" r="4" fill="#3a2415" />
        <path d="M22,70 A44,44 0 0 0 60,112" fill="none" stroke="#ffc93a" stroke-width="7" stroke-linecap="round" />
        <path d="M60,112 l-12,-12 M60,112 l-14,6" fill="none" stroke="#ffc93a" stroke-width="7" stroke-linecap="round" />
      </svg>
      <div>סובבו את המכשיר לרוחב</div>
    </div>
    <div id="overlay"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
