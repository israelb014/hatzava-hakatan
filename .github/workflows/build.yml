name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Hobby game: the keystore (android/keystore.b64) and its password are intentionally public,
  # so every build is signed with the same key and updates install over older versions.
  KEYSTORE_PASSWORD: hatzava-hakatan

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: version $VERSION [skip ci]"
          git push origin HEAD:main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.bump.outputs.version }}
          gh release create "v$V" --draft --target "${{ steps.bump.outputs.sha }}" --title "הצבא הקטן $V" \
            --notes "גרסה $V של הצבא הקטן. להורדה: קובץ APK לאנדרואיד, קובץ Setup.exe לחלונות, קובץ AppImage ללינוקס. לשחק בדפדפן: https://israelb014.github.io/hatzava-hakatan/"

  test:
    name: Tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  web:
    name: Web (GitHub Pages)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to the gh-pages branch
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ needs.version.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  android:
    name: Android APK
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore
        run: base64 -d android/keystore.b64 > android/release.keystore
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.version.outputs.version }}
          cp android/app/build/outputs/apk/release/app-release.apk hatzava-hakatan.apk
          gh release upload "v$V" hatzava-hakatan.apk --clobber

  windows:
    name: Windows installer
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.version.outputs.version }}
          ls -la release
          gh release upload "v$V" release/*.exe release/*.exe.blockmap release/latest.yml --clobber

  linux:
    name: Linux AppImage
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage --x64 --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.version.outputs.version }}
          ls -la release
          gh release upload "v$V" release/*.AppImage release/latest-linux.yml --clobber

  publish:
    name: Publish release
    needs: [version, web, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="v${{ needs.version.outputs.version }}"
          gh release edit "$V" --draft=false --latest
          # Remove drafts left behind by earlier failed runs.
          for T in $(gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
            if [ "$T" != "$V" ]; then gh release delete "$T" --yes || true; fi
          done
